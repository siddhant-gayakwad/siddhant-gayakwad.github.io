<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('sg-portfolio-theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      html[data-theme="dark"] #root > div[style*="background:#F5F5F3"] {
        background: #0B0F14 !important;
        color: #F4F7FA !important;
      }
    </style>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Siddhant Gayakwad — DevOps Engineer specializing in AWS Cloud, Kubernetes, Docker, CI/CD automation, and scalable cloud infrastructure." />
    <meta name="author" content="Siddhant Gayakwad" />
    <meta property="og:title" content="Siddhant Gayakwad — DevOps Engineer" />
    <meta property="og:description" content="Building, Automating & Scaling the Infrastructure Behind Modern Applications." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F5F5F3" />
    <title>Siddhant Gayakwad — DevOps Engineer | Cloud & Infrastructure</title>
    
    <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- SG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Space Grotesk, sans-serif' font-weight='700' font-size='14' fill='%23F5F5F3'%3ESG%3C/text%3E%3Ccircle cx='24' cy='8' r='3' fill='%2335A878'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#F5F5F3;color:#555;font-family:Inter,system-ui,sans-serif;">
        <div style="text-align:center;">
          <div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;">Siddhant Gayakwad</div>
          <p style="margin-top:10px;font-size:14px;">Loading portfolio…</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById('root');
        function showStartupError(message) {
          if (!root || root.querySelector('.portfolio-app, [data-app-error]')) return;
          root.innerHTML = '';
          var panel = document.createElement('main');
          panel.setAttribute('data-app-error', 'true');
          panel.setAttribute('role', 'alert');
          panel.style.cssText = 'min-height:100vh;display:grid;place-items:center;padding:24px;background:#F5F5F3;color:#171717;font-family:Inter,system-ui,sans-serif';
          var card = document.createElement('section');
          card.style.cssText = 'width:min(680px,100%);padding:30px;background:#fff;border:1px solid #E5E5E5;border-radius:16px';
          var title = document.createElement('h1');
          title.textContent = 'Portfolio could not start';
          title.style.cssText = 'font-size:32px;line-height:1.15;margin:0 0 12px';
          var detail = document.createElement('pre');
          detail.textContent = message;
          detail.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;color:#8B1E16;background:#F5F5F3;padding:14px;border-radius:8px;font-size:12px';
          var help = document.createElement('p');
          help.textContent = 'The page shell loaded, but the app script did not finish starting. Refresh once; if this message remains, share its details.';
          help.style.cssText = 'font-size:14px;line-height:1.6;color:#555';
          card.appendChild(title);
          card.appendChild(help);
          card.appendChild(detail);
          panel.appendChild(card);
          root.appendChild(panel);
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target !== window) {
            if (event.target.tagName === 'SCRIPT') showStartupError('Script failed to load: ' + (event.target.src || 'unknown script'));
            return;
          }
          if (event.message) showStartupError(event.message + (event.filename ? '\\n' + event.filename + ':' + event.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showStartupError(reason && reason.stack ? reason.stack : String(reason || 'Unhandled promise rejection'));
        });
        window.setTimeout(function () {
          if (root && !root.querySelector('.portfolio-app, [data-app-error]')) {
            showStartupError('The React app did not mount within 12 seconds. Check that the JavaScript bundle loaded successfully.');
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
