<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title | default: site.title }} · {{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <a href="{{ '/' | relative_url }}" class="prompt">
            <span class="user">siddhant</span><span class="at">@</span><span class="host">devops</span><span class="colon">:~$</span>
          </a>
        </div>

        <nav class="site-nav">
          {% for item in site.navigation %}
            <a class="nav-link{% if page.url == item.url %} is-active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
          {% endfor %}
          <a class="btn btn-primary" href="{{ site.resume | relative_url }}" target="_blank" rel="noopener">↓ resume.pdf</a>
        </nav>
      </div>
    </header>

    <main class="site-main container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-status">
          <span class="dot"></span> build passing · last deploy {{ site.time | date: '%b %Y' }}
        </div>
        <div class="footer-links">
          <a href="mailto:{{ site.email }}">email</a>
          <a href="{{ site.github }}" target="_blank" rel="noopener">github</a>
          <a href="{{ site.linkedin }}" target="_blank" rel="noopener">linkedin</a>
        </div>
      </div>
    </footer>
  </body>
</html>
