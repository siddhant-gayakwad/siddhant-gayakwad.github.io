<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="theme-color" content="#0b0f14">
    <title>{{ page.title | default: site.title }} · {{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>\n    <div class="scroll-progress" aria-hidden="true"></div>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Siddhant Gayakwad home">
          <span class="brand-mark">sg</span>
          <span class="brand-text">Siddhant<span class="brand-dot">.</span></span>
        </a>

        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
          <span></span><span></span>
        </button>

        <nav class="site-nav" id="site-nav">
          {% for item in site.navigation %}
            <a class="nav-link{% if page.url == item.url %} is-active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title | remove_first: '~/' }}</a>
          {% endfor %}
          <a class="btn btn-primary nav-resume" href="{{ site.resume | relative_url }}" target="_blank" rel="noopener">Resume ↗</a>
        </nav>
      </div>
    </header>

    <main class="site-main container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-status">
          <span class="dot"></span> available for opportunities
        </div>
        <div class="footer-links">
          <a href="mailto:{{ site.email }}">Email</a>
          <a href="{{ site.github }}" target="_blank" rel="noopener">GitHub</a>
          <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        </div>
      </div>
    </footer>

    <script>
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var nav = document.getElementById('site-nav');
      if (!toggle || !nav) return;

      toggle.addEventListener('click', function () {
        var open = nav.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(open));
        document.body.classList.toggle('nav-open', open);
      });

      nav.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          nav.classList.remove('is-open');
          toggle.setAttribute('aria-expanded', 'false');
          document.body.classList.remove('nav-open');
        });
      });
    })();
    </script>
  <script>\n    (function(){\n      var progress=document.querySelector(".scroll-progress");\n      var update=function(){\n        var max=document.documentElement.scrollHeight-window.innerHeight;\n        var value=max>0 ? window.scrollY/max : 0;\n        if(progress) progress.style.transform="scaleX("+Math.min(1,Math.max(0,value))+")";\n      };\n      window.addEventListener("scroll",update,{passive:true});\n      window.addEventListener("resize",update);\n      update();\n\n      if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;\n      var items=document.querySelectorAll(".card,.yaml-card,.badge");\n      if(!("IntersectionObserver" in window)){\n        items.forEach(function(item){item.classList.add("is-visible")});\n        return;\n      }\n      var observer=new IntersectionObserver(function(entries){\n        entries.forEach(function(entry){\n          if(entry.isIntersecting){\n            entry.target.classList.add("is-visible");\n            observer.unobserve(entry.target);\n          }\n        });\n      },{threshold:.12,rootMargin:"0px 0px -8% 0px"});\n      items.forEach(function(item){observer.observe(item)});\n    })();\n    </script>\n  </body>
</html>
