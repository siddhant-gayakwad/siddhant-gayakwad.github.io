name: Build and Deploy Jekyll site

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Bundler & Jekyll
        run: |
          gem install bundler jekyll

      - name: Install dependencies (if Gemfile exists)
        run: |
          if [ -f Gemfile ]; then bundle install; fi

      - name: Build site
        run: |
          # Prefer bundle exec when a Gemfile exists, otherwise run jekyll directly
          if [ -f Gemfile ]; then bundle exec jekyll build --destination _site; else jekyll build --destination _site; fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./_site
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
